name: Deploy REVERIE to Google Cloud Run

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  # ── Lint & Build Check ────────────────────────────────────────────────────
  # Runs on every push. Catches TypeScript / ESLint errors before they reach
  # Cloud Build. No GCP credentials needed — just npm.
  build-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: reverie-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./reverie-frontend
        run: npm ci

      - name: Build Next.js (standalone output)
        working-directory: ./reverie-frontend
        env:
          NEXT_PUBLIC_API_URL: ''   # same-origin in production
        run: npm run build

  # ── Deploy to Cloud Run ──────────────────────────────────────────────────
  # Runs only when the build-check passes.
  # Uses gcloud CLI with a JSON service account key stored as a GitHub secret.
  # The Dockerfile builds both the Python backend AND the Next.js frontend in
  # a single multi-stage image — no Vercel, no separate frontend host.
  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    needs: build-check
    # Only deploy on pushes to main (not on PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit build to Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --substitutions \
              "_GRAFANA_URL=${{ secrets.GRAFANA_URL }},_GRAFANA_API_KEY=${{ secrets.GRAFANA_API_KEY }},_REDIS_URL=" \
            .
